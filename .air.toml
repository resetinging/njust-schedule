root = "."
tmp_dir = ".air-tmp"

[build]
cmd = "go build -o ./.air-tmp/server ./cmd/server"
bin = "./.air-tmp/server"
include_ext = ["go", "html", "css", "js", "json"]
exclude_dir = [".git", ".tmp", ".air-tmp", ".venv", "poster", "tests", "tests_pytest"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[log]
time = true

[screen]
clear_on_rebuild = false
