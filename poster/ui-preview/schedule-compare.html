<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:1300px; background:#EFEFEC; color:#1F2328;
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
    padding:54px 80px; }
  h1 { font-size:26px; font-weight:600; letter-spacing:.5px; }
  .hint { font-size:14px; color:#6B7280; margin-top:8px; }
  .row { display:flex; gap:70px; margin-top:38px; }
  figure { display:flex; flex-direction:column; gap:14px; }
  figcaption { font-size:14px; color:#6B7280; }
  figcaption b { color:#1F2328; font-weight:600; }

  /* 手机框（375×833，与真机截图同比例） */
  .phone { width:375px; height:833px; border-radius:26px; overflow:hidden;
    box-shadow:0 12px 32px rgba(31,35,40,.16); background:#fff;
    display:flex; flex-direction:column; transform-origin:top left; }
  .zoom { width:431px; height:958px; }
  .zoom .phone { transform:scale(1.15); }

  /* ---------- 新版：纸与墨 ---------- */
  .new { background:#F4F5F2; }
  .nstatus { height:34px; display:flex; align-items:center; justify-content:space-between;
    padding:0 18px; font-size:12px; color:#1F2328; font-variant-numeric:tabular-nums; }
  .nstatus .sig { display:flex; gap:3px; }
  .nstatus .sig i { width:14px; height:9px; background:#1F2328; border-radius:1px; opacity:.85; }
  .nnav { height:54px; display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:600; letter-spacing:.2px; position:relative; }
  .nnav .capsule { position:absolute; right:12px; width:76px; height:29px; border-radius:15px;
    border:1px solid rgba(31,35,40,.16); display:flex; align-items:center; justify-content:center;
    gap:10px; font-size:11px; color:#1F2328; }
  .nnav .capsule em { width:14px; height:14px; border:1.5px solid #1F2328; border-radius:50%;
    display:inline-block; }

  .ntop { height:48px; display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; border-bottom:1px solid #E2E3DE; }
  .ntop .sem { font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  .ntop .views { display:flex; gap:6px; }
  .ntop .views span { width:34px; height:26px; border-radius:6px; display:flex;
    align-items:center; justify-content:center; font-size:12px; color:#6B7280;
    border:1px solid #E2E3DE; background:#fff; }
  .ntop .views .on { background:#2B4C7E; border-color:#2B4C7E; color:#fff; }

  .ntools { height:46px; display:flex; align-items:center; gap:10px; padding:0 16px;
    border-bottom:1px solid #E2E3DE; }
  .ntools .nav { color:#6B7280; font-size:11px; }
  .ntools .wk { display:flex; flex-direction:column; line-height:1.25; }
  .ntools .wk b { font-size:15px; font-weight:600; }
  .ntools .wk i { font-style:normal; font-size:11px; color:#6B7280;
    font-variant-numeric:tabular-nums; }
  .ntools .now-tag { margin-left:auto; font-size:10px; font-weight:600; color:#2B4C7E;
    background:#E7ECF4; border-radius:4px; padding:3px 7px; letter-spacing:.5px; }
  .ntools .acts { margin-left:12px; display:flex; gap:14px; font-size:14px; color:#6B7280; }

  /* 网格：细线 + 课程块进格子 */
  .grid { display:grid; grid-template-columns:44px repeat(7,1fr);
    grid-template-rows:46px repeat(14,39.07px); }
  .grid .hd { display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:1px; font-size:11.5px; color:#6B7280;
    border-bottom:1px solid #E2E3DE; }
  .grid .hd b { font-size:10px; font-weight:500; opacity:.65;
    font-variant-numeric:tabular-nums; }
  .grid .hd.today { color:#E4572E; font-weight:600; position:relative; }
  .grid .hd.today b { opacity:1; font-weight:600; }
  .grid .hd.today:after { content:""; position:absolute; bottom:5px; width:16px; height:2px;
    background:#E4572E; }
  .grid .t { display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; font-size:9px; color:#6B7280; border-right:1px solid #E2E3DE;
    font-variant-numeric:tabular-nums; }
  .grid .t b { font-size:10px; color:#1F2328; font-weight:600; }
  .grid .c { border-right:1px solid #E9EAE5; border-bottom:1px solid #E9EAE5; }
  .grid .c.today { background:#FAFAF7; }
  /* 今天整列：极淡橙底（垫在单元格下面，网格线仍可见） */
  .grid .today-col { background:#FBF0E9; }

  .co { border-radius:5px; padding:3px 4px 3px 7px; overflow:hidden; position:relative;
    font-size:9px; line-height:1.22; font-weight:600; margin:1.5px 2px; }
  .co:before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; }
  .co i { display:block; font-style:normal; font-weight:400; font-size:8px;
    margin-top:2px; opacity:.75; white-space:nowrap; overflow:hidden; }
  .co.b { background:#DCE7F5; color:#2B4C7E; } .co.b:before { background:#2B4C7E; }
  .co.g { background:#DDEBDD; color:#3B6B3B; } .co.g:before { background:#3B6B3B; }
  .co.y { background:#F6EBC8; color:#8A6A12; } .co.y:before { background:#B98A16; }
  .co.p { background:#F3DEE2; color:#8C4356; } .co.p:before { background:#8C4356; }
  .co.v { background:#E6E0F2; color:#5A4A85; } .co.v:before { background:#5A4A85; }

  /* tabbar：纯图标 + 选中态 */
  .ntab { margin-top:auto; height:58px; background:#FCFCFA; border-top:1px solid #E2E3DE;
    display:flex; align-items:center; justify-content:space-around; }
  .ntab .it { position:relative; display:flex; }
  .ntab svg { width:22px; height:22px; stroke:#1F2328; stroke-width:1.6; fill:none;
    opacity:.45; stroke-linecap:round; stroke-linejoin:round; }
  .ntab .on svg { stroke:#2B4C7E; opacity:1; }
  .ntab .on:after { content:""; position:absolute; left:50%; transform:translateX(-50%);
    bottom:-7px; width:4px; height:4px; border-radius:50%; background:#2B4C7E; }

  .note { margin-top:34px; font-size:14px; color:#4B5563; line-height:1.7; }
  .note b { color:#1F2328; font-weight:600; }
</style></head>
<body>
  <h1>课表页 · 风格对比</h1>

    <figure>

          <div class="t" style="grid-column:1;grid-row:9"><b>8</b>15:50</div>
          <div class="t" style="grid-column:1;grid-row:10"><b>9</b>16:40</div>
          <div class="t" style="grid-column:1;grid-row:11"><b>10</b>17:30</div>
          <div class="t" style="grid-column:1;grid-row:12"><b>11</b>19:00</div>
          <div class="t" style="grid-column:1;grid-row:13"><b>12</b>19:50</div>
          <div class="t" style="grid-column:1;grid-row:14"><b>13</b>20:40</div>
          <div class="t" style="grid-column:1;grid-row:15"><b>14</b>网课</div>

          <!-- 单元格背景 -->
          <div class="c" style="grid-column:2/9;grid-row:2"></div>
          <div class="c" style="grid-column:2/9;grid-row:3"></div>
          <div class="c" style="grid-column:2/9;grid-row:4"></div>
          <div class="c" style="grid-column:2/9;grid-row:5"></div>
          <div class="c" style="grid-column:2/9;grid-row:6"></div>
          <div class="c" style="grid-column:2/9;grid-row:7"></div>
          <div class="c" style="grid-column:2/9;grid-row:8"></div>
          <div class="c" style="grid-column:2/9;grid-row:9"></div>
          <div class="c" style="grid-column:2/9;grid-row:10"></div>
          <div class="c" style="grid-column:2/9;grid-row:11"></div>
          <div class="c" style="grid-column:2/9;grid-row:12"></div>
          <div class="c" style="grid-column:2/9;grid-row:13"></div>
          <div class="c" style="grid-column:2/9;grid-row:14"></div>
          <div class="c" style="grid-column:2/9;grid-row:15"></div>

          <!-- 课程（列：一=2 … 日=8） -->
          <div class="co v" style="grid-column:2;grid-row:9/11">人工智能与<br>智能机器人<i>IV-A406</i></div>
          <div class="co y" style="grid-column:3;grid-row:3/5">嵌入式系统<i>IV-B210</i></div>

          <div class="co g" style="grid-column:3;grid-row:7/9">控制工程基础<i>IV-B312</i></div>
          <div class="co b" style="grid-column:4;grid-row:3/5">机器人传感<br>器及其应用<i>IV-A208</i></div>
          <div class="co v" style="grid-column:4;grid-row:5/7">人工智能与<br>智能机器人<i>IV-A406</i></div>
          <div class="co y" style="grid-column:5;grid-row:7/9">嵌入式系统<i>IV-B210</i></div>
          <div class="co g" style="grid-column:6;grid-row:2/5">控制工程基础<i>IV-B312</i></div>

          <div class="co p" style="grid-column:6;grid-row:9/11">机器人结构<br>设计及分析<i>IV-C201</i></div>
        </div>

        <div class="ntab">
          <span class="it on"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9.5 4v16"/></svg></span>
          <span class="it"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>
          <span class="it"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9.5 14l2 2 3.5-4"/></svg></span>
          <span class="it"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 20V11M12 20V5M18 20v-6"/></svg></span>
          <span class="it"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.5-3.6 4.2-5.2 7.5-5.2s6 1.6 7.5 5.2"/></svg></span>

      </div></div>
    </figure>
  </div>

  <p class="note"><b>这一版做了什么：</b>去掉渐变顶栏和"每块都套卡片"的堆叠；课程回到网格里，颜色只承担区分课程和标记今天；圆角只留给可点的控件。</p>
</body></html>
