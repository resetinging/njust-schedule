<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课表助手 · 控制面板</title>
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>

  <!-- 登录视图 -->
  <div id="loginView" class="login-wrap hidden">
    <div class="login-card">
      <div class="login-logo">📊</div>
      <h1>课表助手 · 控制面板</h1>
      <p class="sub">管理员登录</p>
      <input id="adminPwd" type="password" placeholder="请输入管理密码"
             autocomplete="current-password" />
      <button id="loginBtn" class="primary">登 录</button>
      <div id="loginErr" class="err hidden"></div>
    </div>
  </div>

  <!-- 主视图 -->
  <div id="mainView" class="main-wrap hidden">
    <header class="topbar">
      <div class="brand">📊 课表助手 · 控制面板</div>
      <div class="top-right">
        <span id="sseStatus" class="sse-status">● 监控中</span>
        <button id="logoutBtn" class="ghost">退出</button>
      </div>
    </header>

    <!-- 统计卡片 -->
    <section class="stat-row" id="statRow"></section>
    <div class="panel-tool stat-tool">
      <span class="dim">数据为打开时/手动刷新时获取</span>
      <button id="refreshSummaryBtn" class="ghost small">🔄 刷新仪表盘</button>
    </div>

    <!-- Tab 导航 -->
    <nav class="tabs">
      <button class="tab active" data-tab="requests">实时请求</button>
      <button class="tab" data-tab="users">用户</button>
      <button class="tab" data-tab="sessions">在线会话</button>
      <button class="tab" data-tab="grades">成绩统计</button>
      <button class="tab" data-tab="announce">📢 公告</button>
      <button class="tab" data-tab="feedback">✉️ 反馈</button>
    </nav>

    <section id="panel-requests" class="panel active">
      <div class="panel-tool">
        <div class="filters">
          <select id="fStatus">
            <option value="">全部状态</option>
            <option value="2">2xx 成功</option>
            <option value="4">4xx 客户端错误</option>
            <option value="5">5xx 服务器错误</option>
            <option value="401">401 未授权</option>
          </select>
          <select id="fMethod">
            <option value="">全部方法</option>
            <option value="GET">GET</option>
            <option value="POST">POST</option>
          </select>
          <select id="fTime">
            <option value="0">全部时间</option>
            <option value="600">近 10 分钟</option>
            <option value="1800">近 30 分钟</option>
            <option value="3600">近 1 小时</option>
            <option value="10800">近 3 小时</option>
          </select>
          <input id="fSid" placeholder="学号筛选" />
          <input id="fPath" placeholder="路径关键词" />
          <label class="chk-label"><input type="checkbox" id="autoScroll" checked> 跟随最新</label>
        </div>
        <div class="btn-group">
          <button id="reqPause" class="ghost small">⏸ 暂停</button>
          <button id="reqExport" class="ghost small">⬇ 导出 CSV</button>
          <button id="reqClear" class="ghost small">清空</button>
        </div>
      </div>
      <div id="reqStats" class="req-stats"></div>
      <div class="req-pager">
        <button id="pgPrev" class="ghost small">‹ 上一页</button>
        <span id="pgInfo"></span>
        <button id="pgNext" class="ghost small">下一页 ›</button>
      </div>
      <div id="reqList" class="req-list"></div>
    </section>

    <section id="panel-users" class="panel">
      <div class="panel-tool">
        <div class="filters">
          <input id="userSearch" placeholder="🔍 搜索学号 / 姓名" class="search-wide" />
        </div>
        <div class="btn-group">
          <button id="refreshUsersBtn" class="ghost small">🔄 刷新</button>
          <button id="fetchNamesBtn" class="ghost small">获取缺失姓名</button>
        </div>
      </div>
      <div id="fetchNamesMsg" class="req-stats"></div>
      <div id="userList" class="user-list"></div>
    </section>

    <section id="panel-sessions" class="panel">
      <div class="panel-tool">
        <span class="dim">在线会话每 10 秒自动刷新</span>
        <button id="refreshSessionsBtn" class="ghost small">🔄 立即刷新</button>
      </div>
      <div id="sessionList" class="user-list"></div>
    </section>

    <section id="panel-grades" class="panel">
      <div class="panel-tool">
        <span class="dim">手动刷新获取最新统计</span>
        <button id="refreshStatsBtn" class="ghost small">🔄 刷新统计</button>
      </div>
      <div class="card">
        <h3>请求趋势（最近 60 分钟）</h3>
        <div id="reqTrendChart" class="chart trend-chart"></div>
      </div>
      <div class="grid-2">
        <div class="card">
          <h3>成绩等级分布</h3>
          <div id="levelChart" class="chart"></div>
        </div>
        <div class="card">
          <h3>学生最高 GPA 分布</h3>
          <div id="gpaChart" class="chart"></div>
        </div>
      </div>
      <div class="card">
        <h3>各学期平均绩点（官方绩点制）</h3>
        <div id="semAvgChart" class="chart sem-chart"></div>
      </div>
    </section>

    <section id="panel-announce" class="panel">
      <div class="card">
        <h3>📢 小程序公告栏管理</h3>
        <p class="dim" style="margin-bottom:12px">公告显示在小程序"我的"页面下方横幅；保存后小程序端自动生效（每次进入页面拉取）。</p>
        <div class="announce-row">
          <label class="chk-label"><input type="checkbox" id="annEnabled" checked> 显示公告</label>
          <span id="annUpdated" class="dim"></span>
        </div>
        <textarea id="annText" class="ann-input"
                  placeholder="输入公告内容（如：期末考试成绩已发布，请同学们查收…）"
                  maxlength="500"></textarea>
        <div class="ann-actions">
          <span id="annCount" class="dim">0 / 500</span>
          <button id="annSave" class="primary ann-save">保存公告</button>
        </div>
      </div>
    </section>

    <section id="panel-feedback" class="panel">
      <div class="panel-tool">
        <span class="dim">问题反馈（用户提交，可标记处理/删除）</span>
        <div class="btn-group">
          <select id="feedbackStatus" class="ghost small">
            <option value="">全部</option>
            <option value="pending">待处理</option>
            <option value="done">已处理</option>
          </select>
          <button id="refreshFeedbackBtn" class="ghost small">🔄 刷新</button>
        </div>
      </div>
      <div id="feedbackList" class="board-list"></div>
    </section>
  </div>

  <!-- 用户详情抽屉 -->
  <div id="drawer" class="drawer hidden">
    <div class="drawer-head">
      <span id="drawerTitle"></span>
      <button id="drawerClose" class="ghost">✕</button>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
  </div>

  <script src="/static/js/admin.js"></script>
</body>
</html>
