# 微信云托管「实时开发(Live Coding)」用的 WebGo 配置。
version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.development
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    ports:
      - 27081:80              # 主机端口:容器端口(插件默认)
    container_name: wxcloud_wxcloudrun-flask-5da7
    labels:                   # 容器标签, 供插件识别
      - wxPort=27082
      - hostPort=27081
      - wxcloud=wxcloudrun
      - flask-5da7
      - role=container
    environment:
      - MYSQL_USERNAME=${MYSQL_USERNAME:-}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_ADDRESS=${MYSQL_ADDRESS:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-flask_demo}
      - SESSION_KEY=${SESSION_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - FREE_CLASSROOM_PREWARM=0
      - CAPTCHA_OCR_MODEL_PATH=${CAPTCHA_OCR_MODEL_PATH:-common.onnx}
      - ONNXRUNTIME_SHARED_LIBRARY_PATH=${ONNXRUNTIME_SHARED_LIBRARY_PATH:-}
    networks:
      default:
        external:
          name: wxcb0           # 容器网络, 插件要求, 一般不改
volumes:
  go-mod-cache:
  go-build-cache:
